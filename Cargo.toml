[package]
name = "simplest_drone"
version = "0.1.0"
edition = "2024"

[features]
telemetry = ["dep:embassy-usb-logger"]

[dependencies]
ahrs = { version = "0.7.0", default-features = false, features = ["field_access"] }

bmp388-embedded = { version = "0.1", features = ["async"] }

cortex-m-rt = "0.7.0"

drone_consts = { path = "../drone_consts" }

embassy-dshot = { version = "0.3.0", features = ["rp2350"] }
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = [ 
    "executor-thread", 
    "executor-interrupt", 
    "platform-cortex-m"
] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = [
    "critical-section-impl", 
    "time-driver", 
    "rp235xa", 
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = {version = "0.6.0", features = ["max-interface-count-8"] }
embassy-usb-logger = {version = "0.6.0", optional = true }

embedded-storage-async = "0.4.1"
embedded-hal-bus = "0.3.0"

icm20948-async = { git = "https://github.com/peterkrull/icm20948-async" }

log = "0.4.27"

nalgebra = { version = "0.33.2", default-features = false }

panic-probe = "1.0.0"
portable-atomic = { version = "1.11.1", features = ["critical-section"] }

sbus = { git = "https://github.com/peterkrull/sbus" }
signal-filters = "0.1.10"
static_cell = "2.0"

[profile.dev]
opt-level = 2 # Or "s" / "z" for space/speed balance

[profile.release]
opt-level = 3
lto = true
codegen-units = 1